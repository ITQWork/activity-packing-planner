<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackSmart | Your Trip Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: 'rgb(var(--p-50) / <alpha-value>)',
                            100: 'rgb(var(--p-100) / <alpha-value>)',
                            200: 'rgb(var(--p-200) / <alpha-value>)',
                            300: 'rgb(var(--p-300) / <alpha-value>)',
                            400: 'rgb(var(--p-400) / <alpha-value>)',
                            500: 'rgb(var(--p-500) / <alpha-value>)',
                            600: 'rgb(var(--p-600) / <alpha-value>)',
                            700: 'rgb(var(--p-700) / <alpha-value>)',
                            800: 'rgb(var(--p-800) / <alpha-value>)',
                            900: 'rgb(var(--p-900) / <alpha-value>)',
                            950: 'rgb(var(--p-950) / <alpha-value>)',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        [v-cloak] { display: none; }
        :root {
            --p-50: 238 242 255;
            --p-100: 224 231 255;
            --p-200: 199 210 254;
            --p-300: 165 180 252;
            --p-400: 129 140 248;
            --p-500: 99 102 241;
            --p-600: 79 70 229;
            --p-700: 67 56 202;
            --p-800: 55 48 163;
            --p-900: 49 46 129;
            --p-950: 30 27 75;
            --p-gradient: linear-gradient(135deg, rgb(var(--p-600)) 0%, rgb(var(--p-400)) 100%);
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #0f172a;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: #f1f5f9; transition: background-color 0.5s ease; }
        h1, h2, h3, button, .font-heading { font-family: 'Outfit', sans-serif; }
        .gradient-bg { background: var(--p-gradient); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input[type="date"]::-webkit-calendar-picker-indicator { 
            cursor: pointer; 
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }
        .dark-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); transition: background-color 0.5s ease; }
        .sidebar-item-active { background: rgb(var(--p-600) / 0.1); color: rgb(var(--p-400)); border-right: 3px solid rgb(var(--p-600)); }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgb(var(--p-600) / 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgb(var(--p-600) / 0.5); }
    </style>
</head>
<body class="min-h-screen selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="app" v-cloak>
        <!-- Auth Overlay -->
        <div v-if="!user" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-md">
            <div class="bg-slate-900 p-8 rounded-[2rem] shadow-2xl w-full max-w-md border border-white/5">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white mb-4 shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-suitcase-rolling text-xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-white tracking-tight">PackSmart</h1>
                    <p class="text-slate-400 font-medium mt-2">{{ isLogin ? 'Ready for your next adventure?' : 'Start your organizing journey' }}</p>
                </div>

                <form @submit.prevent="handleAuth" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Username</label>
                        <input v-model="authForm.username" type="text" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/50 outline-none transition-all font-medium">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
                        <input v-model="authForm.password" type="password" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/50 outline-none transition-all font-medium">
                    </div>
                    <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl shadow-xl shadow-indigo-600/10 transition transform active:scale-[0.98] mt-2">
                        {{ isLogin ? 'Sign In' : 'Join PackSmart' }}
                    </button>
                </form>

                <div class="mt-8 text-center border-t border-slate-800 pt-6">
                    <button @click="isLogin = !isLogin" class="text-indigo-400 hover:text-indigo-300 font-bold text-xs uppercase tracking-widest transition">
                        {{ isLogin ? "Create an account" : "Already have an account?" }}
                    </button>
                </div>
            </div>
        </div>

        <template v-if="user">
            <!-- Sidebar Navigation -->
            <aside :style="{ backgroundColor: 'var(--bg-sidebar)' }" class="fixed left-0 top-0 bottom-0 w-20 md:w-64 border-r border-slate-800 z-40 flex flex-col items-center md:items-stretch transition-all duration-300">
                <div class="p-6 flex items-center space-x-3 mb-8">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/20 shrink-0">
                        <i class="fa-solid fa-suitcase-rolling"></i>
                    </div>
                    <span class="text-xl font-black tracking-tight text-white hidden md:block">PackSmart</span>
                </div>

                <nav class="flex-grow px-3 space-y-1">
                    <button v-for="v in ['trips', 'activities', 'library', 'memories', 'help']" 
                            @click="view = v" 
                            :class="view === v ? 'sidebar-item-active' : 'text-slate-500 hover:bg-slate-800 hover:text-slate-300'"
                            class="w-full p-4 rounded-2xl transition flex items-center space-x-4 font-bold capitalize group">
                        <i :class="getNavIcon(v)" class="w-6 text-center text-lg group-hover:scale-110 transition shrink-0"></i>
                        <span class="hidden md:block">{{ v }}</span>
                    </button>
                </nav>

                <div class="p-2 md:p-4 border-t border-slate-800">
                    <div class="bg-slate-800/50 p-2 md:p-4 rounded-2xl flex flex-col md:flex-row items-center justify-center md:justify-start md:space-x-3 relative">
                        <div @click="showThemePicker = !showThemePicker" class="w-10 h-10 rounded-full bg-slate-700 shadow-sm flex items-center justify-center text-indigo-400 font-black text-xs shrink-0 cursor-pointer hover:ring-2 hover:ring-indigo-500 transition-all relative group">
                            {{ user.username.charAt(0).toUpperCase() }}
                            <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-indigo-600 rounded-full flex items-center justify-center border-2 border-slate-900 group-hover:scale-110 transition">
                                <i class="fa-solid fa-palette text-[8px] text-white"></i>
                            </div>
                        </div>

                        <!-- Theme Picker Popover -->
                        <div v-if="showThemePicker" class="absolute bottom-full left-1/2 md:left-4 -translate-x-1/2 md:translate-x-0 mb-4 bg-slate-900 border border-slate-800 p-4 rounded-3xl shadow-2xl z-50 w-56 animate-in fade-in slide-in-from-bottom-2 duration-200">
                            <div class="flex items-center justify-between mb-4">
                                <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Select Theme</h4>
                                <button @click="showThemePicker = false" class="text-slate-600 hover:text-white transition">
                                    <i class="fa-solid fa-times text-[10px]"></i>
                                </button>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <button v-for="t in themes" 
                                        :key="t.name" 
                                        @click="setTheme(t)"
                                        class="group flex flex-col items-center space-y-1.5 p-2 rounded-xl transition hover:bg-slate-800">
                                    <div class="w-8 h-8 rounded-full shadow-lg transition group-hover:scale-110" 
                                         :style="{ backgroundColor: t.color, border: currentTheme?.name === t.name ? '3px solid white' : 'none' }"></div>
                                    <span class="text-[8px] font-black uppercase tracking-tighter" :class="currentTheme?.name === t.name ? 'text-indigo-400' : 'text-slate-600'">{{ t.name }}</span>
                                </button>
                            </div>
                        </div>

                        <div class="hidden md:block flex-grow min-w-0">
                            <p class="text-xs font-black text-white truncate uppercase tracking-tighter">{{ user.username }}</p>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Organizer</p>
                        </div>
                        <button @click="logout" class="text-slate-600 hover:text-red-400 transition px-2 mt-2 md:mt-0">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="ml-20 md:ml-64 p-4 md:p-8 transition-all duration-300">
                <div class="max-w-6xl mx-auto space-y-8">
                    
                    <!-- Trips View -->
                    <section v-if="view === 'trips'" class="space-y-8">
                        <div class="dark-card p-6 md:p-8 rounded-[2rem] shadow-sm relative overflow-hidden">
                            <div class="absolute -right-8 -top-8 opacity-[0.03] pointer-events-none rotate-12 text-white">
                                <i class="fa-solid fa-plane-departure text-[12rem]"></i>
                            </div>
                            
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
                                <div>
                                    <h2 class="text-2xl font-black text-white tracking-tight">New Adventure</h2>
                                    <p class="text-sm text-slate-500 font-medium">Where's your curiosity taking you next?</p>
                                </div>
                                <button @click="createTrip" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-8 py-3.5 rounded-2xl shadow-xl shadow-indigo-600/10 active:scale-[0.98] transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                    <span>Plan Trip</span>
                                </button>
                            </div>

                            <div class="grid grid-cols-4 gap-2 lg:gap-6 items-end">
                                <div class="space-y-2 col-span-1">
                                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.1em] block text-center">Destination</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-location-dot absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
                                        <input v-model="newTrip.destination" placeholder="Des" class="w-full bg-slate-800 border-none pl-9 pr-2 py-4 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 outline-none transition font-semibold text-white placeholder:text-slate-600 text-xs">
                                    </div>
                                </div>
                                <div class="space-y-2 col-span-1">
                                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.1em] block text-center">Activity</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-person-hiking absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs pointer-events-none"></i>
                                        <select v-model="newTrip.activity_id" class="w-full bg-slate-800 border-none pl-2 pr-2 py-4 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 outline-none transition font-semibold text-white appearance-none text-xs text-center">
                                            <option value="" disabled selected hidden>Acti</option>
                                            <option v-for="a in activities" :key="a.id" :value="a.id" class="bg-slate-800 text-center">{{ a.name }}</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="space-y-2 col-span-1">
                                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.1em] block text-center">Start</label>
                                    <div class="bg-slate-800 rounded-2xl p-1 relative flex items-center">
                                        <i class="fa-regular fa-calendar-plus absolute left-3 text-slate-600 text-xs pointer-events-none"></i>
                                        <input type="date" v-model="newTrip.start_date" class="w-full bg-transparent border-none py-3 pl-9 outline-none text-[10px] font-black uppercase text-slate-300 cursor-pointer relative z-10 text-center">
                                    </div>
                                </div>
                                <div class="space-y-2 col-span-1">
                                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.1em] block text-center">End</label>
                                    <div class="bg-slate-800 rounded-2xl p-1 relative flex items-center">
                                        <i class="fa-regular fa-calendar-check absolute left-3 text-slate-600 text-xs pointer-events-none"></i>
                                        <input type="date" v-model="newTrip.end_date" class="w-full bg-transparent border-none py-3 pl-9 outline-none text-[10px] font-black uppercase text-slate-300 cursor-pointer relative z-10 text-center">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-12">
                            <!-- Upcoming Trips -->
                            <div v-if="upcomingTrips.length" class="space-y-6">
                                <div class="flex items-center justify-between px-2">
                                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] flex items-center">
                                        <span class="w-6 h-1 bg-indigo-500 rounded-full mr-3"></span>
                                        Upcoming Trips
                                    </h3>
                                    <span class="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-lg text-[10px] font-black">{{ upcomingTrips.length }}</span>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div v-for="trip in upcomingTrips" :key="trip.id" class="bg-slate-800/40 rounded-[2rem] border border-white/5 overflow-hidden hover:bg-slate-800 hover:border-indigo-500/30 transition-all duration-500 group cursor-pointer" @click="viewTrip(trip)">
                                        <div class="p-6">
                                            <div class="flex justify-between items-start mb-6">
                                                <div class="min-w-0">
                                                    <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">{{ getActivityName(trip.activity_id) }}</p>
                                                    <h3 class="font-black text-xl text-white truncate group-hover:text-indigo-400 transition">{{ trip.destination }}</h3>
                                                </div>
                                                <div class="bg-slate-800 group-hover:bg-indigo-600 text-slate-400 group-hover:text-white p-3 rounded-2xl transition duration-500 shadow-sm border border-white/5 relative">
                                                    <i class="fa-solid fa-bolt-lightning text-sm"></i>
                                                    <button @click.stop="deleteTrip(trip.id)" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600 shadow-lg">
                                                        <i class="fa-solid fa-times text-[10px]"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="flex items-center space-x-3 bg-black/20 p-3 rounded-2xl mb-6">
                                                <i class="fa-regular fa-calendar text-slate-500"></i>
                                                <span class="text-[11px] font-black text-slate-300 uppercase tracking-tighter">
                                                    {{ formatDateRange(trip.start_date, trip.end_date) }}
                                                </span>
                                            </div>
                                            <div class="flex items-center justify-between">
                                                <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Click to pack</span>
                                                <div class="flex items-center text-xs font-black text-indigo-400 uppercase tracking-widest">
                                                    Ready
                                                    <i class="fa-solid fa-chevron-right ml-2 group-hover:translate-x-1 transition"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Future Trips -->
                            <div v-if="futureTrips.length" class="space-y-6">
                                <div class="flex items-center justify-between px-2">
                                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] flex items-center">
                                        <span class="w-6 h-1 bg-slate-700 rounded-full mr-3"></span>
                                        Future Wandering
                                    </h3>
                                    <span class="px-2.5 py-1 bg-slate-800 text-slate-500 rounded-lg text-[10px] font-black">{{ futureTrips.length }}</span>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                                    <div v-for="trip in futureTrips" :key="trip.id" class="dark-card rounded-3xl p-5 hover:border-indigo-500/30 hover:bg-slate-800 transition-all duration-300 group relative">
                                        <div class="flex justify-between items-start mb-4">
                                            <div class="min-w-0 pr-8">
                                                <h3 class="font-bold text-white truncate">{{ trip.destination }}</h3>
                                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">{{ getActivityName(trip.activity_id) }}</p>
                                            </div>
                                            <button @click.stop="deleteTrip(trip.id)" class="absolute right-4 top-4 text-slate-700 hover:text-red-400 transition z-10">
                                                <i class="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                        <div class="text-[10px] font-black text-slate-400 mb-4 bg-black/20 py-2 px-3 rounded-xl inline-block">
                                            {{ formatDateRange(trip.start_date, trip.end_date) }}
                                        </div>
                                        <button @click="viewTrip(trip)" class="w-full py-3 bg-slate-800 hover:bg-indigo-500 hover:text-white text-slate-500 font-black rounded-xl transition text-[10px] uppercase tracking-[0.15em]">
                                            Open Planner
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Activities View -->
                    <section v-if="view === 'activities'" class="space-y-8">
                        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                            <div>
                                <h2 class="text-3xl font-black tracking-tight text-white">Activity Templates</h2>
                                <p class="text-slate-500 font-medium mt-1">Reusable checklists for your favorite hobbies.</p>
                            </div>
                            <div class="flex bg-slate-800 p-2 rounded-2xl border border-white/5 w-full sm:w-80">
                                <input v-model="newActivityName" placeholder="Hiking, Golf, Spa..." class="flex-grow bg-transparent border-none px-4 outline-none font-bold text-sm text-white placeholder:text-slate-600">
                                <button @click="createActivity" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-600/10 hover:bg-indigo-500 transition">Add</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div v-for="activity in activities" :key="activity.id" class="bg-slate-800/40 rounded-[2rem] border border-white/5 shadow-sm hover:border-indigo-500/30 transition-all duration-300 p-6 flex flex-col h-full">
                                <div class="flex justify-between items-start mb-6">
                                    <div class="w-10 h-10 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                                        <i class="fa-solid fa-person-hiking"></i>
                                    </div>
                                    <button @click="deleteActivity(activity.id)" class="text-slate-700 hover:text-red-400 transition">
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                                
                                <h3 class="font-black text-xl text-white mb-6">{{ activity.name }}</h3>
                                
                                <div class="flex-grow space-y-4">
                                    <div v-if="!activity.items_with_qty || activity.items_with_qty.length === 0" class="text-center py-8 px-4 bg-black/10 rounded-2xl border-2 border-dashed border-slate-800">
                                        <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest">No items linked</p>
                                    </div>
                                    <ul v-else class="space-y-2">
                                        <li v-for="item in activity.items_with_qty" class="flex items-center justify-between bg-slate-800/50 py-2 px-3 rounded-xl border border-white/5">
                                            <span class="text-xs font-bold text-slate-300 truncate pr-2">{{ item.name }}</span>
                                            <span class="text-[10px] font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded shrink-0">x{{ item.base_quantity }}</span>
                                        </li>
                                    </ul>
                                </div>

                                <div class="mt-8 pt-6 border-t border-slate-800 space-y-4">
                                    <p class="text-[10px] font-black text-slate-600 uppercase tracking-widest ml-1">Add Item</p>
                                    <div class="grid grid-cols-5 gap-2">
                                        <select v-model="activityLinks[activity.id].item_id" class="col-span-3 bg-slate-900 border-none rounded-xl px-2 py-3 text-[10px] font-bold text-slate-400 outline-none">
                                            <option value="">Select Gear...</option>
                                            <option v-for="i in items" :key="i.id" :value="i.id" class="bg-slate-900">{{ i.name }}</option>
                                        </select>
                                        <input v-model.number="activityLinks[activity.id].base_quantity" type="number" class="col-span-1 bg-slate-900 border-none rounded-xl px-2 py-3 text-[10px] font-black text-center text-white outline-none" placeholder="Qty">
                                        <button @click="addItemToActivity(activity.id)" class="col-span-1 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/10 active:scale-95 transition">
                                            <i class="fa-solid fa-plus text-[10px]"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Library View -->
                    <section v-if="view === 'library'" class="space-y-8">
                        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                            <div>
                                <h2 class="text-3xl font-black tracking-tight text-white">Gear Library</h2>
                                <p class="text-slate-500 font-medium mt-1">Manage your inventory of travel items and weight.</p>
                            </div>
                            <div class="flex space-x-2">
                                <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-white/5 flex items-center space-x-2">
                                    <i class="fa-solid fa-boxes-stacked text-indigo-400 text-xs"></i>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">{{ items.length }} Items</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- New Item Panel -->
                            <div class="lg:col-span-1">

                        { name: 'Emerald', color: '#10b981', bg: '#061d15', sidebar: '#04150f', card: '#0a2d20', colors: { 50: '236 253 245', 100: '209 250 229', 200: '167 243 208', 300: '110 231 183', 400: '52 211 153', 500: '16 185 129', 600: '5 150 105', 700: '4 120 87', 800: '6 95 70', 900: '6 78 59', 950: '2 44 34' } },
                        { name: 'Rose', color: '#f43f5e', bg: '#1a0a0c', sidebar: '#120708', card: '#251012', colors: { 50: '255 241 242', 100: '255 228 230', 200: '254 205 211', 300: '253 164 175', 400: '251 113 133', 500: '244 63 94', 600: '225 29 72', 700: '190 18 60', 800: '159 18 57', 900: '136 19 55', 950: '76 5 25' } },
                        { name: 'Amber', color: '#f59e0b', bg: '#1a1205', sidebar: '#120d04', card: '#251a07', colors: { 50: '255 251 235', 100: '254 243 199', 200: '253 230 138', 300: '252 211 77', 400: '251 191 36', 500: '245 158 11', 600: '217 119 6', 700: '180 83 9', 800: '146 64 14', 900: '120 53 15', 950: '69 26 3' } },
                        { name: 'Sky', color: '#0ea5e9', bg: '#051624', sidebar: '#030f1a', card: '#0a2235', colors: { 50: '240 249 255', 100: '224 242 254', 200: '186 230 253', 300: '125 211 252', 400: '56 189 248', 500: '14 165 233', 600: '2 132 199', 700: '3 105 161', 800: '7 89 133', 900: '12 74 110', 950: '8 47 71' } },
                        { name: 'Violet', color: '#8b5cf6', bg: '#12091d', sidebar: '#0c0614', card: '#1a0e2a', colors: { 50: '245 243 255', 100: '237 233 254', 200: '221 214 254', 300: '196 181 253', 400: '167 139 250', 500: '139 92 246', 600: '124 58 237', 700: '109 40 217', 800: '91 33 182', 900: '76 29 149', 950: '46 16 101' } }
                    ],
                    currentTheme: null
                }
            },
            computed: {
                sortedTrips() {
                    return [...this.trips].sort((a, b) => new Date(b.start_date) - new Date(a.start_date));
                },
                activeTrips() {
                    return this.sortedTrips.filter(t => !t.is_completed);
                },
                completedTrips() {
                    return this.sortedTrips.filter(t => t.is_completed);
                },
                filteredMemories() {
                    if (this.ratingFilter === 0) return this.completedTrips;
                    return this.completedTrips.filter(t => t.rating === this.ratingFilter);
                },
                upcomingTrips() {
                    const now = new Date();
                    now.setHours(0,0,0,0);
                    const nextWeek = new Date();
                    nextWeek.setDate(now.getDate() + 7);
                    
                    return this.activeTrips.filter(t => {
                        const start = new Date(t.start_date);
                        return start >= now && start <= nextWeek;
                    });
                },
                futureTrips() {
                    const now = new Date();
                    now.setHours(0,0,0,0);
                    const nextWeek = new Date();
                    nextWeek.setDate(now.getDate() + 7);
                    
                    return this.activeTrips.filter(t => new Date(t.start_date) > nextWeek);
                }
            },
            mounted() {
                const savedTheme = localStorage.getItem('packsmart_theme');
                if (savedTheme) {
                    const theme = this.themes.find(t => t.name === savedTheme);
                    if (theme) this.setTheme(theme);
                    else this.setTheme(this.themes[0]);
                } else {
                    this.setTheme(this.themes[0]);
                }
                if (this.user) this.fetchData();
            },
            methods: {
                setTheme(theme) {
                    this.currentTheme = theme;
                    localStorage.setItem('packsmart_theme', theme.name);
                    const root = document.documentElement;
                    Object.entries(theme.colors).forEach(([level, value]) => {
                        root.style.setProperty(`--p-${level}`, value);
                    });
                    root.style.setProperty('--bg-main', theme.bg);
                    root.style.setProperty('--bg-sidebar', theme.sidebar);
                    root.style.setProperty('--bg-card', theme.card);
                    this.showThemePicker = false;
                },
                async handleAuth() {
                    const endpoint = this.isLogin ? '/login' : '/signup';
                    try {
                        const res = await axios.post(endpoint, this.authForm);
                        if (this.isLogin) {
                            this.user = res.data;
                            localStorage.setItem('packsmart_user', JSON.stringify(this.user));
                            this.fetchData();
                        } else {
                            this.isLogin = true;
                            alert('Welcome! Sign in to start planning.');
                        }
                    } catch (e) {
                        alert(e.response?.data?.detail || 'Login failed');
                    }
                },
                logout() {
                    this.user = null;
                    localStorage.removeItem('packsmart_user');
                },
                async fetchData() {
                    if (!this.user || !this.user.user_id) return;
                    try {
                        const [items, categories, activities, trips] = await Promise.all([
                            axios.get('/items'),
                            axios.get('/categories'),
                            axios.get('/activities'),
                            axios.get('/trips', { params: { user_id: this.user.user_id } })
                        ]);
                        this.items = items.data;
                        this.categories = categories.data;
                        this.activities = activities.data;
                        this.trips = trips.data;
                        
                        const newLinks = { ...this.activityLinks };
                        this.activities.forEach(a => {
                            if (!newLinks[a.id]) {
                                newLinks[a.id] = { item_id: '', base_quantity: 1 };
                            }
                        });
                        this.activityLinks = newLinks;
                    } catch (e) { console.error(e); }
                },
                async createCategory() {
                    await axios.post('/categories', { name: this.newCategoryName });
                    this.newCategoryName = '';
                    await this.fetchData();
                },
                async deleteCategory(id) {
                    if (!confirm('Delete this category? Items will be uncategorized.')) return;
                    try {
                        await axios.delete(`/categories/${id}`);
                        await this.fetchData();
                    } catch (e) { alert('Delete failed'); }
                },
                async createItem() {
                    await axios.post('/items', this.newItem);
                    this.newItem = { name: '', unit_weight: 0, category_id: '' };
                    await this.fetchData();
                },
                async deleteItem(id) {
                    if (!confirm('Remove from library?')) return;
                    try {
                        await axios.delete(`/items/${id}`);
                        await this.fetchData();
                    } catch (e) { alert('Delete failed'); }
                },
                async createActivity() {
                    try {
                        await axios.post('/activities', { name: this.newActivityName });
                        this.newActivityName = '';
                        await this.fetchData();
                    } catch (e) {
                        alert(e.response?.data?.detail || 'Failed');
                    }
                },
                async addItemToActivity(activityId) {
                    const link = this.activityLinks[activityId];
                    if (!link.item_id) return;
                    try {
                        await axios.post(`/activities/${activityId}/items/${link.item_id}?base_quantity=${link.base_quantity}`);
                        await this.fetchData();
                    } catch (e) { console.error(e); }
                },
                async deleteActivity(activityId) {
                    if (!confirm('Discard template?')) return;
                    try {
                        await axios.delete(`/activities/${activityId}`);
                        await this.fetchData();
                    } catch (e) {
                        alert(e.response?.data?.detail || 'Used in active trip');
                    }
                },
                async saveTrip(trip) {
                    try {
                        await axios.patch(`/trips/${trip.id}`, {
                            start_date: trip.start_date,
                            end_date: trip.end_date
                        });
                        this.editingTrip = null;
                        await this.fetchData();
                        if (this.selectedTrip && this.selectedTrip.id === trip.id) {
                            await this.viewTrip(this.selectedTrip);
                        }
                    } catch (e) {
                        alert('Update failed');
                    }
                },
                async deleteTrip(tripId) {
                    if (!confirm('Delete this trip?')) return;
                    try {
                        await axios.delete(`/trips/${tripId}`);
                        await this.fetchData();
                    } catch (e) {
                        alert(e.response?.data?.detail || 'Deletion failed');
                    }
                },
                async createTrip() {
                    const tripData = { ...this.newTrip, user_id: this.user.user_id }; 
                    if (!tripData.destination || !tripData.activity_id || !tripData.start_date || !tripData.end_date) {
                        alert('Details incomplete');
                        return;
                    }
                    try {
                        await axios.post('/trips', tripData);
                        this.newTrip = { destination: '', activity_id: '', start_date: '', end_date: '' };
                        await this.fetchData();
                    } catch (e) { console.error(e); }
                },
                async viewTrip(trip) {
                    this.selectedTrip = trip;
                    const [items, weather, weight] = await Promise.all([
                        axios.get(`/trips/${trip.id}/items`),
                        axios.get(`/trips/${trip.id}/weather`),
                        axios.get(`/trips/${trip.id}/weight`)
                    ]);
                    this.tripItems = items.data;
                    this.weather = weather.data;
                    this.tripWeight = weight.data.total_weight;
                },
                async togglePacked(item) {
                    await axios.patch(`/trips/items/${item.id}?is_packed=${item.is_packed}`);
                },
                async downloadPDF(tripId) {
                    try {
                        const response = await axios.get(`/trips/${tripId}/pdf`, { responseType: 'blob' });
                        const url = window.URL.createObjectURL(new Blob([response.data]));
                        const link = document.createElement('a');
                        link.href = url;
                        link.setAttribute('download', `trip_${tripId}.pdf`);
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                    } catch (e) {
                        console.error('PDF export failed', e);
                        alert('Failed to generate PDF');
                    }
                },
                async completeTrip(trip) {
                    if (!confirm('Mark this trip as completed and move to Memories?')) return;
                    try {
                        await axios.patch(`/trips/${trip.id}`, { is_completed: true, rating: 5 });
                        await this.fetchData();
                        if (this.selectedTrip) {
                            this.selectedTrip.is_completed = true;
                            this.editingTrip = null;
                        }
                    } catch (e) { alert('Failed to complete trip'); }
                },
                async rateTrip(trip, rating) {
                    try {
                        await axios.patch(`/trips/${trip.id}`, { rating });
                        trip.rating = rating;
                        await this.fetchData();
                    } catch (e) { alert('Failed to save rating'); }
                },
                getCategoryName(id) {
                    return this.categories.find(c => c.id === id)?.name || 'Misc';
                },
                getActivityName(id) {
                    return this.activities.find(a => a.id === id)?.name || 'General';
                },
                formatDateShort(d) {
                    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                },
                formatDateRange(start, end) {
                    const s = new Date(start);
                    const e = new Date(end);
                    const options = { month: 'short', day: 'numeric' };
                    if (s.getTime() === e.getTime()) return s.toLocaleDateString('en-US', options);
                    return `${s.toLocaleDateString('en-US', options)} - ${e.toLocaleDateString('en-US', options)}`;
                },
                getNavIcon(v) {
                    return { trips: 'fa-solid fa-compass', activities: 'fa-solid fa-person-hiking', library: 'fa-solid fa-boxes-stacked', memories: 'fa-solid fa-camera-retro', help: 'fa-solid fa-circle-info' }[v];
                }
            }
        }).mount('#app')
    </script>
</body>
